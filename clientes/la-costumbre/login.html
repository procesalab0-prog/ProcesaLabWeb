<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>La Costumbre — ProcesaLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --pink:#F7B6C9; --red:#FF4E3A; --cream:#FFFBF6; --ink:#111111; }
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:"Instrument Sans",system-ui,sans-serif;background:var(--pink);color:var(--ink)}
.card{background:#fff;border:1.5px solid var(--ink);border-radius:20px;padding:36px;box-shadow:5px 5px 0 var(--ink);max-width:380px;width:calc(100% - 40px)}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
p{margin:0 0 22px;font-size:14.5px;color:#5a5256}
input{width:100%;font-family:"Instrument Sans";font-size:15px;padding:12px 14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--cream);margin-bottom:14px}
button{width:100%;font-family:"Space Grotesk";font-weight:600;font-size:15px;padding:12px 20px;border-radius:40px;border:1.5px solid var(--ink);cursor:pointer;background:var(--red);color:#fff;box-shadow:4px 4px 0 var(--ink);transition:transform .15s}
button:hover{transform:translate(-2px,-2px)}
.err{color:var(--red);font-size:14px;margin:-6px 0 14px;font-weight:600;display:none}
</style>
</head>
<body>
<div class="card">
  <h1>La Costumbre</h1>
  <p>Documentos preparados por ProcesaLab.</p>
  <form id="loginForm">
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button type="submit">Entrar</button>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  const password = document.getElementById('password').value;
  const res = await fetch('/api/client-login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug: 'la-costumbre', password }),
  });
  if (res.ok) {
    location.href = './';
  } else {
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || 'No se pudo iniciar sesión';
    err.style.display = 'block';
  }
});
</script>
</body>
</html>
